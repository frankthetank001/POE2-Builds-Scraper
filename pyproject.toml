[project]
name = "poe2-builds-scraper"
version = "0.1.0"
description = "Scrape poe.ninja PoE2 builds into a versioned base/mod usage artifact for POE2-PathOfCrafting"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
builds-scraper = "builds_scraper.run:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["builds_scraper", "builds_scraper.roster"]
