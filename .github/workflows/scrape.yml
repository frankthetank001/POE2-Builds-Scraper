name: scrape-builds

# Publishes data/latest-<slug>.json on a schedule so POE2-PathOfCrafting can fetch it
# from raw.githubusercontent.com (mirroring how the app already pulls repoe-fork/pob-data).

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC; bump frequency early-league if you want
  workflow_dispatch:
    inputs:
      league:
        description: "poe.ninja league slug"
        default: "runesofaldur"
      limit:
        description: "max builds to pull"
        default: "100"

permissions:
  contents: write # allow the job to commit the refreshed artifact back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      # Restore the per-character cache so --from-cache can grow the sample over time.
      - name: Restore character cache
        uses: actions/cache@v4
        with:
          path: cache
          key: char-cache-${{ inputs.league || 'runesofaldur' }}-${{ github.run_id }}
          restore-keys: |
            char-cache-${{ inputs.league || 'runesofaldur' }}-

      - name: Scrape current top builds
        run: |
          python -m builds_scraper.run \
            --league "${{ inputs.league || 'runesofaldur' }}" \
            --limit "${{ inputs.limit || '100' }}"

      - name: Re-aggregate the accumulated cache (bigger sample)
        run: |
          python -m builds_scraper.run --from-cache \
            --league "${{ inputs.league || 'runesofaldur' }}"

      - name: Commit published artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest-*.json data/builds-*.json
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "data: refresh build-stats ($(date -u +%Y-%m-%d))"
            git push
          fi
